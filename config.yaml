# Leitmotif settings. Paths are relative to the repository root.

seed: 42

paths:
  raw: data/raw
  processed: data/processed
  splits: data/splits
  results: results
  checkpoints: checkpoints

audio:
  sample_rate: 22050
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  n_chroma: 12
  n_mfcc: 20

# Clips are only 10-30 s long, so the handout's 5-10 s windows would give graphs
# of 1-6 nodes. Shorter overlapping windows (or beats) give the GNN real structure.
segments:
  mode: fixed                  # fixed | beat
  window_seconds: 1.0
  hop_seconds: 0.5

graph:
  type: segment                # segment | chord
  similarity_feature: chroma   # chroma | mfcc
  similarity_threshold: 0.8    # tau: link segments whose cosine similarity is above this
  max_similar_neighbors: 8     # per node, so dense clips don't become complete graphs

text:
  model: bert-base-uncased
  max_length: 128

data:
  musiccaps:
    clip_seconds: 10
    top_k_tags: 50
  fma:
    subset: small
    clip_seconds: 30

train:
  bert_tags:                   # stage 1
    epochs: 10
    batch_size: 32
    lr: 3.0e-5                 # BERT weights
    head_lr: 1.0e-3            # classification head
  gnn_genre:                   # stage 2
    epochs: 60
    batch_size: 64
    hidden: 256
    layers: 3
    dropout: 0.3
    lr: 1.0e-3
    weight_decay: 1.0e-4
  cnn_genre:                   # baseline B2
    epochs: 30
    batch_size: 32
    dropout: 0.3
    lr: 1.0e-3
    weight_decay: 1.0e-4
  fusion:                      # stage 3
    epochs: 15
    batch_size: 32
    dim: 256
    heads: 4
    dropout: 0.2
    trainable_bert_layers: 4   # top BERT layers fine-tuned; the rest stay frozen
    bert_lr: 2.0e-5
    lr: 1.0e-3
  contrastive:                 # stage 4
    epochs: 30
    batch_size: 64             # in-batch negatives
    dim: 256
    temperature: 0.07          # starting value; learned during training
    trainable_bert_layers: 4
    bert_lr: 2.0e-5
    lr: 5.0e-4
